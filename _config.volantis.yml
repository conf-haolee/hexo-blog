  darkmode:
    enable: true
  # To use hexo wordcount,you need to install the following plugins:
  # npm i hexo-wordcount
  # 字数统计
  wordcount:
    enable: true
  # 访问统计
  busuanzi:
    enable: true
  
  # # 代码高亮
  # code_highlight: highlightjs # highlightjs or prismjs
